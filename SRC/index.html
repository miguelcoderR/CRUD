<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Inventario Web</title>
  <link rel="stylesheet" href="./CSS/styles.css" />
</head>
<body>
  <div class="contenedor">
    <h1>Inventario de Productos</h1>

    <input id="nombre" type="text" placeholder="Nombre del producto" />
    <input id="precio" type="number" placeholder="Precio" min="0" />
    <input id="cantidad" type="number" placeholder="Cantidad" min="0" />
    <button onclick="agregarProducto()">Agregar producto</button>

    <div id="inventarioLista"></div>
  </div>

  <script src="./js/main.js"></script>
</body>
</html>
